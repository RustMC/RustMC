name: Bug report
description: Report reproducible RustMC scaffold behavior without secrets.
body:
  - type: input
    id: version
    attributes:
      label: RustMC version or commit
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps and expected/actual results
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: OS, Rust toolchain, and relevant configuration fields
      description: Remove secrets and private paths.
