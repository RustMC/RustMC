name: release
# Tag pushes (v*) build portable release binaries and attach them to a DRAFT
# GitHub Release. Nothing is published to end users until the owner reviews
# and publishes the draft manually, per the project's release policy.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Build release binary
        run: cargo build --release --locked -p rustmc-server --target ${{ matrix.target }}
      - name: Package archive and checksum (Linux)
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          tar -C "target/$TARGET/release" -czf "rustmc-server-$VERSION-$TARGET.tar.gz" rustmc-server
          sha256sum "rustmc-server-$VERSION-$TARGET.tar.gz" > "rustmc-server-$VERSION-$TARGET.tar.gz.sha256"
      - name: Package archive and checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          Compress-Archive -Path "target/$env:TARGET/release/rustmc-server.exe" -DestinationPath "rustmc-server-$env:VERSION-$env:TARGET.zip"
          $zip = "rustmc-server-$env:VERSION-$env:TARGET.zip"
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          Set-Content -Encoding ascii -Path "$zip.sha256" -Value "$hash  $zip"
      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustmc-server-${{ matrix.target }}
          path: rustmc-server-*
          if-no-files-found: error
  draft:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$TAG" --draft --verify-tag --title "$TAG" dist/*
