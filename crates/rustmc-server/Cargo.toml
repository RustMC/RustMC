[package]
name = "rustmc-server"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "RustMC local development runtime"

[dependencies]
toml = "=1.1.8"
signal-hook = { version = "=0.4.5", default-features = false }
uuid = { version = "=1.28.0", default-features = false, features = ["v4"] }
md-5 = { version = "=0.11.0", default-features = false }
serde_json = "=1.0.154"
sha2 = { version = "=0.11.1", default-features = false }
rustc-hash = "=2.1.3"
crc32fast = { version = "=1.5.2", default-features = false }
