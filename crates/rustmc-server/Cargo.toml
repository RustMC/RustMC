[package]
name = "rustmc-server"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "RustMC local development runtime"

[dependencies]
toml = "=1.2.1"
signal-hook = { version = "=0.4.6", default-features = false }
uuid = { version = "=1.29.2", default-features = false, features = ["v4"] }
md-5 = { version = "=0.11.0", default-features = false }
serde_json = "=1.0.154"
sha2 = { version = "=0.11.1", default-features = false }
rustc-hash = "=2.1.3"
crc32fast = { version = "=1.5.4", default-features = false }
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
rsa = { version = "=0.10.0", features = ["pkcs1v15"] }
aes = "=0.9.4"
cfb8 = "=0.9.1"
sha1 = "=0.11.0"
getrandom = { version = "=0.4.3", features = ["sys_rng"] }
